spring.application.name=collabnotes

# --- Database (H2 in-memory for easy demo/testing) ---
spring.datasource.url=jdbc:h2:mem:collabnotes;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- To switch to PostgreSQL for production: see README ---

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Ponytail: pulling from env keeps the secret out of source. Provide APP_JWT_SECRET in the host.
app.jwt.secret=${APP_JWT_SECRET:ChangeThisSecretKeyToSomethingLongAndRandomForProduction1234567890}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# --- Server ---
server.port=${PORT:8080}

# CORS — comma-separated list of frontend origins. Default * is fine for the local demo;
# for Vercel deployment set this to e.g. "https://collabnotes-frontend.vercel.app".
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}
