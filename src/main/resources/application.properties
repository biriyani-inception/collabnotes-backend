spring.application.name=collabnotes

# Local runs use H2. Render sets DB_HOST/DB_PORT/DB_NAME and the Docker entrypoint
# builds the PostgreSQL JDBC URL for production.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:collabnotes;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${APP_JWT_SECRET:ChangeThisSecretKeyToSomethingLongAndRandomForProduction1234567890}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
server.port=${PORT:8080}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}
