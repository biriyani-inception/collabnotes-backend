# Render (https://render.com) — single service, free tier, Java + WebSockets.
# Set APP_JWT_SECRET and APP_CORS_ALLOWED_ORIGINS in the Render dashboard.

services:
  - type: web
    name: collabnotes-backend
    env: java
    plan: free
    buildCommand: mvn -B -DskipTests package
    startCommand: java -jar target/collabnotes.jar
    envVars:
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://collabnotes-frontend.vercel.app"
      - key: APP_JWT_EXPIRATION_MS
        value: 86400000
    healthCheckPath: /api/auth/me
