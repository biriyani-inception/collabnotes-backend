# Render Blueprint: Spring Boot API and PostgreSQL.
databases:
  - name: collabnotes-db
    databaseName: collabnotes
    user: collabnotes
    plan: free

services:
  - type: web
    name: collabnotes-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION_MS
        value: "86400000"
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DB_HOST
        fromDatabase:
          name: collabnotes-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: collabnotes-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: collabnotes-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: collabnotes-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: collabnotes-db
          property: password
