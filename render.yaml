# Render Blueprint: Spring Boot API + managed PostgreSQL.
databases:
  - name: collabnotes-db
    databaseName: collabnotes
    user: collabnotes
    plan: free

services:
  - type: web
    name: collabnotes-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION_MS
        value: "86400000"
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "*"
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: collabnotes-db
          property: connectionString
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: DB_USER
        fromDatabase:
          name: collabnotes-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: collabnotes-db
          property: password
